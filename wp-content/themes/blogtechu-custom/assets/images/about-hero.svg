<svg width="640" height="412" viewBox="0 0 640 412" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TechuvaDojo team illustration">
  <defs>
    <linearGradient id="abBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="abScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="abA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="abB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="abC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="640" height="412" rx="24" fill="url(#abBg)"/>
  <g opacity="0.10" fill="#ffffff"><circle cx="60" cy="60" r="2"/><circle cx="90" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="60" cy="90" r="2"/><circle cx="90" cy="90" r="2"/><circle cx="120" cy="90" r="2"/></g>

  <!-- Presentation screen on the wall -->
  <rect x="150" y="60" width="340" height="150" rx="12" fill="url(#abScreen)"/>
  <g transform="translate(176 86)">
    <text x="0" y="14" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">techuva<tspan fill="#60a5fa">dojo</tspan></text>
    <rect x="0" y="34" width="120" height="7" rx="3.5" fill="#334155"/>
    <rect x="0" y="48" width="92" height="7" rx="3.5" fill="#334155"/>
    <!-- mini chart -->
    <g transform="translate(196 8)">
      <rect x="0" y="44" width="14" height="20" rx="2" fill="#3b82f6"/>
      <rect x="22" y="32" width="14" height="32" rx="2" fill="#60a5fa"/>
      <rect x="44" y="20" width="14" height="44" rx="2" fill="#93c5fd"/>
      <rect x="66" y="36" width="14" height="28" rx="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Plant -->
  <g transform="translate(548 250)">
    <path d="M16 70V40" stroke="#64748b" stroke-width="3"/>
    <path d="M16 46c-12-2-18-12-16-26 14 0 20 10 16 26zM16 42c10-3 14-12 12-24-12 1-16 10-12 24z" fill="#22c55e"/>
    <path d="M6 70h20l-3 14H9z" fill="#cbd5e1"/>
  </g>

  <!-- Desk -->
  <rect x="70" y="330" width="500" height="16" rx="6" fill="#e2e8f0"/>
  <rect x="70" y="346" width="500" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Laptops -->
  <g transform="translate(150 300)"><rect x="0" y="0" width="64" height="40" rx="4" fill="#0f172a"/><rect x="6" y="6" width="52" height="28" rx="2" fill="#1e293b"/><rect x="-6" y="40" width="76" height="6" rx="3" fill="#94a3b8"/></g>
  <g transform="translate(420 300)"><rect x="0" y="0" width="64" height="40" rx="4" fill="#0f172a"/><rect x="6" y="6" width="52" height="28" rx="2" fill="#1e293b"/><rect x="-6" y="40" width="76" height="6" rx="3" fill="#94a3b8"/></g>

  <!-- Team avatars (head + shoulders) behind desk -->
  <g transform="translate(232 244)"><path d="M-26 86a26 26 0 0 1 52 0z" fill="url(#abA)"/><circle cx="0" cy="40" r="22" fill="url(#abA)"/></g>
  <g transform="translate(320 232)"><path d="M-28 96a28 28 0 0 1 56 0z" fill="url(#abC)"/><circle cx="0" cy="42" r="24" fill="url(#abC)"/></g>
  <g transform="translate(408 244)"><path d="M-26 86a26 26 0 0 1 52 0z" fill="url(#abB)"/><circle cx="0" cy="40" r="22" fill="url(#abB)"/></g>

  <!-- Sparkles -->
  <g fill="#93c5fd"><path d="M120 250l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M512 120l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" opacity="0.8"/></g>
</svg>
