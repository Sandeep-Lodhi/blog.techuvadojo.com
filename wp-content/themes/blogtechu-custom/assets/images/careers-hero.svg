<svg width="540" height="400" viewBox="0 0 540 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team collaboration illustration">
  <defs>
    <linearGradient id="crBubbleA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="crBubbleB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="crBubbleC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <radialGradient id="crHalo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <filter id="crSh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1736" flood-opacity="0.55"/></filter>
  </defs>

  <ellipse cx="280" cy="205" rx="220" ry="170" fill="url(#crHalo)"/>

  <!-- dotted connectors -->
  <g stroke="#60a5fa" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M120 110 C170 140 200 150 230 165"/>
    <path d="M430 120 C380 150 350 158 322 170"/>
    <path d="M120 320 C175 296 205 286 235 270"/>
    <path d="M430 320 C378 296 350 286 320 272"/>
  </g>

  <!-- central board -->
  <g filter="url(#crSh)">
    <rect x="170" y="120" width="200" height="160" rx="18" fill="#ffffff"/>
  </g>
  <!-- board header -->
  <circle cx="196" cy="148" r="11" fill="url(#crBubbleA)"/>
  <rect x="214" y="142" width="80" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="214" y="154" width="54" height="6" rx="3" fill="#eef2f7"/>
  <!-- avatar stack -->
  <g>
    <circle cx="344" cy="148" r="10" fill="url(#crBubbleB)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="330" cy="148" r="10" fill="url(#crBubbleC)" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- task rows with checks -->
  <g>
    <path d="M188 180 l4 4 7 -8" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="208" y="177" width="140" height="7" rx="3.5" fill="#eef2f7"/>
    <path d="M188 202 l4 4 7 -8" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="208" y="199" width="120" height="7" rx="3.5" fill="#eef2f7"/>
  </g>
  <!-- mini bar chart -->
  <g>
    <rect x="190" y="248" width="14" height="16" rx="2" fill="#bfdbfe"/>
    <rect x="212" y="240" width="14" height="24" rx="2" fill="#93c5fd"/>
    <rect x="234" y="232" width="14" height="32" rx="2" fill="#3b82f6"/>
    <rect x="256" y="244" width="14" height="20" rx="2" fill="#60a5fa"/>
  </g>

  <!-- floating avatars -->
  <g filter="url(#crSh)"><circle cx="96" cy="96" r="34" fill="url(#crBubbleA)"/></g>
  <g transform="translate(78 80)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="13" r="7"/><path d="M5 33a13 13 0 0 1 26 0"/></g>

  <g filter="url(#crSh)"><circle cx="452" cy="104" r="32" fill="url(#crBubbleB)"/></g>
  <g transform="translate(435 89)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="12" r="6.5"/><path d="M5 31a12 12 0 0 1 24 0"/></g>

  <g filter="url(#crSh)"><circle cx="100" cy="332" r="30" fill="url(#crBubbleC)"/></g>
  <g transform="translate(84 318)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="11" r="6"/><path d="M5 29a11 11 0 0 1 22 0"/></g>

  <g filter="url(#crSh)"><circle cx="448" cy="332" r="30" fill="url(#crBubbleA)"/></g>
  <g transform="translate(432 318)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="11" r="6"/><path d="M5 29a11 11 0 0 1 22 0"/></g>

  <!-- sparkles -->
  <g fill="#93c5fd">
    <path d="M300 78l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M150 200l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" opacity="0.8"/>
  </g>
</svg>
